name: Relay Agent Stream9 package check
on:
  pull_request:
    paths:
      - 'terraform/vpn/bootstrap.sh.tftpl'
      - 'terraform/vpn/amazon-ssm-agent.gpg'
      - 'tests/test_relay_bootstrap.py'
      - 'tests/relay-agent-stream9.sh'
      - '.github/workflows/relay-agent-stream9.yml'
permissions:
  contents: read
jobs:
  package-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bootstrap command-double regression
        env:
          FDS_TEST_BASH: /usr/bin/bash
        run: python3 -m unittest discover -s tests -p test_relay_bootstrap.py -v
      - name: Stream9 DEFAULT crypto-policy package installation
        env:
          EVIDENCE: ${{ runner.temp }}/relay-agent-stream9
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf '%s\n' "$SOURCE_HEAD" > "$EVIDENCE/source-head.txt"
          date -u +%FT%TZ > "$EVIDENCE/started-utc.txt"
          docker pull quay.io/centos/centos:stream9
          image=$(docker image inspect quay.io/centos/centos:stream9 --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$image" > "$EVIDENCE/container-image.txt"
          docker run --rm --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$EVIDENCE,target=/evidence" \
            "$image" bash /source/tests/relay-agent-stream9.sh 2>&1 | tee "$EVIDENCE/container.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relay-agent-stream9-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relay-agent-stream9
          if-no-files-found: error
          retention-days: 7
