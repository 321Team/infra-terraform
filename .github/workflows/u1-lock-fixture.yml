name: U1 lock fixture offline checks
on:
  pull_request:
    paths:
      - 'tools/u1_lock_fixture.py'
      - 'tests/test_u1_lock_fixture.py'
      - 'docs/preflight-20261007/u1-lock-fixture-runner.md'
      - '.github/workflows/u1-lock-fixture.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Offline failure and ownership checks (no AWS)
        run: python3 -m unittest discover -s tests -p test_u1_lock_fixture.py -v
